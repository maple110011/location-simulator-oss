name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Core self-tests (pure JVM, 90 assertions)
        run: ./tools/run-selftest.sh
        env:
          JDK_HOME: ${{ env.JAVA_HOME }}

      - name: Fetch Robolectric android-all jars
        run: node tools/fetch-test-deps.mjs
        env:
          ROBOLECTRIC_DEPS_DIR: ${{ github.workspace }}/.robolectric-deps

      - name: Build debug APK and run Android-layer tests
        run: gradle :app:assembleDebug :app:testDebugUnitTest --no-daemon --console=plain
        env:
          ROBOLECTRIC_DEPS_DIR: ${{ github.workspace }}/.robolectric-deps

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
